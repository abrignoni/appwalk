# Builds the AppWalk programs for macOS, Windows and Linux, each on ARM64 and x64, and checks every
# build by running it (devtools/build_binaries.py). Not signed yet.
#
# Run it by hand (Actions, Build binaries, Run workflow) to get the six packs as downloads of the run.
# Push a tag such as v0.1.0 to also make a draft release with the six packs, to be published by hand.
name: Build binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: windows-11-arm, name: windows-arm64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages (Tk and a virtual display for the window check)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb tk8.6
      - name: Python packages
        run: python -m pip install pyinstaller==6.22.3 customtkinter==6.0.0 reportlab==4.4.6 pillow
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build and check
        if: runner.os != 'Linux'
        run: python devtools/build_binaries.py --out dist-release
      - name: Build and check (with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python devtools/build_binaries.py --out dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: appwalk-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Draft release with the six packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "AppWalk $GITHUB_REF_NAME" \
            --notes "Builds for macOS, Windows and Linux, each on ARM64 and x64. Not signed yet: see README.txt inside each pack. adb is not included; install Android's SDK Platform-Tools. Each build was checked by running it before it was attached."
